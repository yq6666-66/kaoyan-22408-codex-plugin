name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run static, unit, security, and local-validator evidence gates
        run: python scripts/check.py --verify-system-evidence
      - name: Check forward-evidence consistency (non-authoritative)
        if: ${{ hashFiles('tests/forward-eval-evidence.json') != '' }}
        run: python evals/verify_forward_evidence.py --max-age-days 30
      - name: Build Ubuntu release archive
        run: python scripts/build_release.py
      - name: Read manifest-derived metadata
        id: meta
        run: python ci/release_metadata.py --artifact-suffix ubuntu --github-output "$GITHUB_OUTPUT"
      - name: Upload Ubuntu release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/${{ steps.meta.outputs.archive }}
            dist/${{ steps.meta.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned core dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 jsonschema==4.25.1
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Build Windows release archive
        run: python scripts/build_release.py
      - name: Read manifest-derived metadata
        id: meta
        shell: pwsh
        run: python ci/release_metadata.py --artifact-suffix windows --github-output $env:GITHUB_OUTPUT
      - name: Upload Windows release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/${{ steps.meta.outputs.archive }}
            dist/${{ steps.meta.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  reproducible:
    name: reproducible
    needs:
      - validate
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Download Ubuntu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: artifacts/ubuntu
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: artifacts/windows
      - name: Require byte-identical archives
        run: python ci/verify_reproducible.py artifacts/ubuntu artifacts/windows

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - validate
      - windows
      - reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require tag commit to be on protected main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Install authenticated-evidence verifier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Verify externally authenticated forward evidence
        env:
          ALLOWED_SIGNERS: ${{ vars.KAOYAN_FORWARD_EVAL_ALLOWED_SIGNERS }}
        run: |
          if [ -z "$ALLOWED_SIGNERS" ]; then
            echo "KAOYAN_FORWARD_EVAL_ALLOWED_SIGNERS is not configured" >&2
            exit 1
          fi
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/kaoyan-forward-eval.allowed_signers"
          python ci/trusted_forward_attestation.py verify \
            --repo . \
            --binding-mode protected-main \
            --allowed-signers "$RUNNER_TEMP/kaoyan-forward-eval.allowed_signers"
      - name: Require tag to match manifest version
        id: meta
        run: python ci/release_metadata.py --expect-tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Download verified Ubuntu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: dist
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.meta.outputs.tag }}"
          "dist/${{ steps.meta.outputs.archive }}"
          "dist/${{ steps.meta.outputs.checksum }}"
          --verify-tag
          --title "kaoyan-22408 ${{ steps.meta.outputs.tag }}"
          --generate-notes
