name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag to create and publish (for example v1.4.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run offline quality gates
        run: python scripts/check.py --verify-system-evidence
      - name: Build Ubuntu release archive
        run: python scripts/build_release.py
      - name: Read manifest-derived metadata
        id: meta
        run: python ci/release_metadata.py --artifact-suffix ubuntu --github-output "$GITHUB_OUTPUT"
      - name: Upload Ubuntu release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/${{ steps.meta.outputs.archive }}
            dist/${{ steps.meta.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run Windows offline quality gates
        run: python scripts/check.py --verify-system-evidence
      - name: Build Windows release archive
        run: python scripts/build_release.py
      - name: Read manifest-derived metadata
        id: meta
        shell: pwsh
        run: python ci/release_metadata.py --artifact-suffix windows --github-output $env:GITHUB_OUTPUT
      - name: Upload Windows release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/${{ steps.meta.outputs.archive }}
            dist/${{ steps.meta.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

  reproducible:
    name: reproducible
    needs:
      - validate
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Download Ubuntu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: artifacts/ubuntu
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: artifacts/windows
      - name: Require byte-identical archives
        run: python ci/verify_reproducible.py artifacts/ubuntu artifacts/windows

  release:
    name: release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - validate
      - windows
      - reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Require release commit to be on protected main
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - name: Require tag to match manifest version
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: python ci/release_metadata.py --expect-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Download verified Ubuntu artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact }}
          path: dist
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          args=(
            "${{ steps.meta.outputs.tag }}"
            "dist/${{ steps.meta.outputs.archive }}"
            "dist/${{ steps.meta.outputs.checksum }}"
            --title "kaoyan-22408 ${{ steps.meta.outputs.tag }}"
            --generate-notes
          )
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          gh release create "${args[@]}"
